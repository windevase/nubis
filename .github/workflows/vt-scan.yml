name: vt-scan

# 이미 나온 릴리스의 파일(zip + 안의 Nubis.exe)을 VirusTotal 에 올린다 — Actions 탭에서 수동 실행
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스 태그 (예: v0.2.0)'
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # tools/vt-scan.ps1

      - name: 릴리스 파일 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p '*.zip' -D scan
          unzip -q scan/*.zip -d scan/x
          cp scan/x/Nubis/Nubis.exe scan/
          # Nubis.dll 은 따로 올리지 않는다 — 샌드박스가 DLL 을 단독 exe 로 실행하다 죽어
          # 의심 행동으로 표시한다. 앱 코드(Nubis.dll)는 zip 검사에 포함된다
          sha256sum scan/*.zip scan/Nubis.*

      - name: VirusTotal 검사
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        # 이미 검사된 파일도 최신 엔진으로 다시 분석한다. 결과는 실행 요약에 표로 남는다
        run: ./tools/vt-scan.ps1 -Rescan -Path (Get-ChildItem scan -File).FullName
