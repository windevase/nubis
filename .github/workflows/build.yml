name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # 태그 빌드에서 릴리스 생성

jobs:
  build:
    runs-on: windows-latest
    env:
      # VirusTotal API 키 (저장소 Settings → Secrets → Actions 의 VT_API_KEY). 없으면 검사 단계를 건너뛴다
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 테스트
        shell: pwsh
        run: ./build.ps1 test

      - name: 포터블 zip 만들기
        shell: pwsh
        run: |
          # v1.2.3 태그면 그 버전, 아니면 csproj 버전
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '' }
          ./build.ps1 publish -Version $ver

      - uses: actions/upload-artifact@v7
        with:
          name: Nubis-portable-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: 릴리스 (v* 태그)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: VirusTotal 검사 (v* 태그)
        if: startsWith(github.ref, 'refs/tags/v') && env.VT_API_KEY != ''
        # 검사 결과(탐지 엔진·진단명)는 실행 요약에 표로 남는다. 검사가 실패해도 릴리스 설명 갱신은 계속한다
        continue-on-error: true
        shell: pwsh
        # Nubis.dll 은 따로 올리지 않는다 — 샌드박스가 DLL 을 단독 exe 로 실행하다 죽어 의심 행동으로 표시한다.
        # 앱 코드(Nubis.dll)는 zip 검사에 포함된다
        run: ./tools/vt-scan.ps1 -Path publish/Nubis.exe, (Get-Item dist/*.zip).FullName

      - name: 릴리스 설명에 SHA256 · VirusTotal 링크
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # VirusTotal 결과 주소는 파일 SHA256 으로 정해진다 (검사 전에는 "찾을 수 없음")
          $lines = @('', '### Checksums · VirusTotal', '', '| File | SHA256 | Scan |', '|---|---|---|')
          foreach ($l in Get-Content dist/SHA256SUMS.txt) {
            $hash, $name = $l -split '\s+', 2
            # Nubis.dll 은 VT 에 따로 올리지 않으므로 해시만 (zip 검사에 포함)
            $scan = if ($name -like '*Nubis.dll') { 'in zip' } else { "[VirusTotal](https://www.virustotal.com/gui/file/$hash)" }
            $lines += "| ``$name`` | ``$hash`` | $scan |"
          }
          $body = gh release view $env:GITHUB_REF_NAME --json body --jq .body
          (@($body) + $lines) -join "`n" | Set-Content -Encoding utf8 notes.md
          gh release edit $env:GITHUB_REF_NAME --notes-file notes.md
