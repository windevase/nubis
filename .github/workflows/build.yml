name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # 태그 빌드에서 릴리스 생성

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 테스트
        shell: pwsh
        run: ./build.ps1 test

      - name: 포터블 zip 만들기
        shell: pwsh
        run: |
          # v1.2.3 태그면 그 버전, 아니면 csproj 버전
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '' }
          ./build.ps1 publish -Version $ver

      - uses: actions/upload-artifact@v7
        with:
          name: Nubis-portable-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: 릴리스 (v* 태그)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
