<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #161925; overflow: hidden; }
  #t { position: absolute; top: 10px; left: 14px; right: 6px; bottom: 6px; }
  /* 앱 디자인 토큰(Themes\Tokens.xaml)을 옮긴 값 — 터미널 글자색은 사용자 테마를 따르고, 둘레 크롬(찾기 상자·끊김 카드)만 앱 색을 쓴다.
     성능: 계속 도는 애니메이션·backdrop-filter 는 쓰지 않는다. 움직임은 hover·나타날 때 한 번(≤150ms)뿐 */
  :root {
    --overlay: #1E2129; --stroke: rgba(255,255,255,.09); --stroke-strong: rgba(255,255,255,.16);
    --text: #EDEFF4; --text2: #A0A6B4; --text3: #717789;
    --accent: #2CC9A3; --accent-hover: #46D6B3; --accent-pressed: #23AD8B; --on-accent: #04241C;
    --fill-hover: rgba(255,255,255,.06); --fill-pressed: rgba(255,255,255,.04); --input: rgba(255,255,255,.04); --input-focus: rgba(0,0,0,.16);
    --danger: #EC5257; --warning: #F5B740;
    --thumb: rgba(255,255,255,.14); --thumb-show: rgba(255,255,255,.24); --thumb-hover: rgba(255,255,255,.42);
    --ui-font: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif;
    --icon-font: "Segoe Fluent Icons", "Segoe MDL2 Assets";
  }
  /* 밝은 터미널 테마: 스크롤바만 어두운 색으로 (찾기 상자·카드는 앱과 같은 어두운 카드 그대로) */
  body.light { --thumb: rgba(0,0,0,.16); --thumb-show: rgba(0,0,0,.26); --thumb-hover: rgba(0,0,0,.45); }

  /* 스크롤바: 가는 둥근 막대 · 투명 트랙. 평소엔 옅게, 터미널 위에 마우스가 있으면 진하게, 막대 위면 더 진하게.
     (scrollbar-width/scrollbar-color 표준 속성을 쓰면 Chromium 이 ::-webkit-scrollbar 를 무시하므로 쓰지 않는다) */
  .xterm .xterm-viewport::-webkit-scrollbar { width: 10px; background: transparent; }
  .xterm .xterm-viewport::-webkit-scrollbar-track,
  .xterm .xterm-viewport::-webkit-scrollbar-corner { background: transparent; }
  .xterm .xterm-viewport::-webkit-scrollbar-button { display: none; }
  .xterm .xterm-viewport::-webkit-scrollbar-thumb { background-color: var(--thumb); background-clip: content-box;
                                                    border: 3px solid transparent; border-radius: 6px; min-height: 32px; }
  .xterm:hover .xterm-viewport::-webkit-scrollbar-thumb { background-color: var(--thumb-show); }
  .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover,
  .xterm .xterm-viewport::-webkit-scrollbar-thumb:active { background-color: var(--thumb-hover); border-width: 2px; }

  /* 나타날 때 한 번만 (display none → flex 마다 다시 재생, 끝나면 멈춘다) */
  @keyframes pop-down { from { opacity: 0; transform: translateY(-4px); } }
  @keyframes pop-up { from { opacity: 0; transform: translate(-50%, 4px); } }

  /* 공통: 아이콘 버튼 (Fluent 글리프) */
  .ib { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; flex: none;
        background: transparent; color: var(--text2); border: 0; border-radius: 6px; cursor: pointer; padding: 0;
        font: 12px var(--icon-font); transition: background-color .1s, color .1s; }
  .ib:hover { background: var(--fill-hover); color: var(--text); }
  .ib:active { background: var(--fill-pressed); color: var(--text2); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* 화면 내용 찾기 (Ctrl+Shift+F): 오른쪽 위에 뜨는 둥근 카드 */
  #find { position: absolute; top: 8px; right: 20px; z-index: 10; display: none; align-items: center; gap: 2px;
          background: var(--overlay); border: 1px solid var(--stroke); border-radius: 8px; padding: 4px;
          font: 12px var(--ui-font); color: var(--text3); box-shadow: 0 6px 20px rgba(0,0,0,.32);
          animation: pop-down .12s ease-out; }
  #find .field { position: relative; display: flex; align-items: center; }
  #find .field::before { content: "\E721"; position: absolute; left: 9px; font: 12px var(--icon-font); color: var(--text3); pointer-events: none; }
  #find input { width: 220px; height: 26px; box-sizing: border-box; background: var(--input); color: var(--text);
                border: 1px solid var(--stroke); border-radius: 6px; padding: 0 8px 0 28px;
                font: 13px var(--ui-font); outline: none; transition: border-color .1s, background-color .1s; }
  #find input::placeholder { color: var(--text3); }
  #find input:hover { border-color: var(--stroke-strong); }
  #find input:focus { border-color: var(--accent); background: var(--input-focus); }
  #find input::selection { background: rgba(44,201,163,.35); color: var(--text); }
  #findCount { min-width: 44px; padding: 0 6px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #findCount:empty { min-width: 0; padding: 0 2px; }
  #find .sep { width: 1px; height: 16px; margin: 0 3px; background: var(--stroke); flex: none; }

  /* 연결이 끊기면 아래쪽 가운데에 뜨는 알약 카드: "● 세션이 종료되었습니다 [다시 연결 Enter]" */
  #reconnect { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10; display: none;
               align-items: center; gap: 10px; max-width: calc(100% - 48px); box-sizing: border-box;
               background: var(--overlay); border: 1px solid var(--stroke); border-radius: 999px; padding: 4px 4px 4px 14px;
               font: 12px var(--ui-font); color: var(--text2); box-shadow: 0 8px 24px rgba(0,0,0,.35);
               animation: pop-up .12s ease-out; }
  #reconnect .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warning); flex: none; }
  #reconnectMsg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #reconnectBtn { display: inline-flex; align-items: center; gap: 8px; flex: none; height: 28px; box-sizing: border-box;
                  background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; cursor: pointer; padding: 0 6px 0 14px;
                  font: 600 12px var(--ui-font); transition: background-color .1s; }
  #reconnectBtn:hover { background: var(--accent-hover); }
  #reconnectBtn:active { background: var(--accent-pressed); }
  #reconnectBtn kbd { font: 600 10.5px var(--ui-font); padding: 2px 6px; border-radius: 999px; background: rgba(4,36,28,.16); }
</style>
</head>
<body>
<div id="t"></div>
<div id="find" role="search"><span class="field"><input id="findText" spellcheck="false" placeholder="화면에서 찾기" aria-label="화면에서 찾기"></span><span id="findCount"></span><span class="sep"></span><button id="findPrev" class="ib" title="이전 결과 (Shift+Enter)">&#xE70E;</button><button id="findNext" class="ib" title="다음 결과 (Enter)">&#xE70D;</button><button id="findClose" class="ib" title="닫기 (Esc)">&#xE711;</button></div>
<div id="reconnect" role="status"><span class="dot"></span><span id="reconnectMsg">세션이 종료되었습니다</span><button id="reconnectBtn" title="Enter 키로도 할 수 있습니다"><span id="reconnectLabel"></span><kbd>Enter</kbd></button></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  const term = new Terminal({
    fontFamily: '"Cascadia Mono", "D2Coding", Consolas, "Malgun Gothic", monospace',
    fontSize: 14,
    lineHeight: 1.15,
    cursorBlink: true,
    scrollback: 10000,
    allowProposedApi: true,
    // OSC 8 링크: 기본 동작(confirm + window.open → 앱 안 팝업) 대신 앱에 넘겨 확인 후 기본 브라우저로 연다 (http/https 만)
    linkHandler: { activate: (ev, uri) => post({ t: 'link', d: uri }), allowNonHttpProtocols: false },
    theme: {
      background: '#161925', foreground: '#E6E8F0', cursor: '#20C5A0', cursorAccent: '#161925',
      selectionBackground: '#3A4A6A',
      black: '#1E2232', red: '#F0616D', green: '#20C5A0', yellow: '#F5B740',
      blue: '#4F8CFF', magenta: '#C27BFF', cyan: '#3EC7E0', white: '#C9CDDB',
      brightBlack: '#5B6180', brightRed: '#FF7A85', brightGreen: '#4BE0BC', brightYellow: '#FFD06B',
      brightBlue: '#7AA8FF', brightMagenta: '#D59BFF', brightCyan: '#6ADCF0', brightWhite: '#FFFFFF'
    }
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  const el = document.getElementById('t');
  term.open(el);
  fit.fit();

  const post = m => window.chrome.webview.postMessage(m);
  // 셀을 읽을 때 쓰는 재사용 객체 — getCell(x) 는 부를 때마다 새 객체를 만든다 (줄마다 수십~수백 개)
  let cellBuf = null;
  const scratchCell = () => cellBuf || (cellBuf = term.buffer.active.getNullCell());

  term.onData(d => post({ t: 'in', d }));
  // 셸이 알려주는 현재 폴더 (OSC 7: ESC ] 7 ; file://host/path BEL) → SFTP 패널이 따라감
  term.parser.registerOscHandler(7, data => { post({ t: 'cwd', d: data }); return true; });
  // 창 크기를 끄는 동안에는 프레임마다 크기가 바뀐다 — 앱(→ 서버의 SIGWINCH)에는 멈춘 뒤 마지막 크기만 알린다
  // (vim·htop 등이 드래그 내내 화면 전체를 다시 그려 보내지 않게)
  let resizePostTimer = 0;
  term.onResize(({ cols, rows }) => {
    clearTimeout(resizePostTimer);
    resizePostTimer = setTimeout(() => post({ t: 'resize', cols: term.cols, rows: term.rows }), 80);
  });
  new ResizeObserver(() => { try { fit.fit(); } catch (e) { } }).observe(el);

  // 붙여넣기 요청: 서버가 bracketed paste 를 켰으면(줄마다 바로 실행되지 않음) 앱이 확인 창을 띄우지 않는다
  // 클립보드는 항상 앱(C#)이 읽어 제어 문자를 걸러 낸 뒤 'paste' 메시지로 돌려준다 — 브라우저 기본 붙여넣기는 쓰지 않음
  const requestPaste = () => post({ t: 'paste', bp: !!(term.modes && term.modes.bracketedPasteMode) });
  // 단축키 붙여넣기: 브라우저 기본 동작(textarea 'paste' → xterm 이 걸러지지 않은 원문을 바로 보냄)을 막는다
  const pasteKey = ev => { ev.preventDefault(); requestPaste(); return false; };
  // 그 밖의 경로로 생긴 브라우저 'paste' 이벤트도 xterm 에 닿기 전에 가로채 앱 경로로 돌린다 (찾기 입력란은 제외)
  document.addEventListener('paste', e => {
    if (e.target && e.target.closest && e.target.closest('#find')) return;
    e.preventDefault(); e.stopImmediatePropagation();
    requestPaste();
  }, true);
  let smartCopy = true;
  let copyOnSelect = false;
  let baseFontSize = 14, zoom = 0;
  function setZoom(z) {
    zoom = Math.max(-6, Math.min(24, z));
    term.options.fontSize = Math.max(6, baseFontSize + zoom);
    try { fit.fit(); } catch (e) { }
    // 앱이 기억해 두었다가 화면을 다시 불러올 때(렌더러 복구) 되돌린다
    post({ t: 'zoom', z: zoom });
  }
  el.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    setZoom(zoom + (e.deltaY < 0 ? 1 : -1));
  }, { passive: false });

  // 복사/붙여넣기: Ctrl+Shift+C / Ctrl+Shift+V, 우클릭(선택 있으면 복사, 없으면 붙여넣기)
  // (설정) Ctrl+C 는 선택이 있을 때만 복사, Ctrl+V 는 붙여넣기 — 단 vim·htop 같은 전체 화면 프로그램(대체 화면 버퍼)
  // 안에서는 Ctrl+V 를 프로그램에 그대로 보낸다 (vim 의 블록 선택 등)
  term.attachCustomKeyEventHandler(ev => {
    if (ev.type !== 'keydown') return true;
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyC') {
      const s = term.getSelection(); if (s) post({ t: 'copy', d: s });
      return false;
    }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyV') return pasteKey(ev);
    if (ev.shiftKey && ev.code === 'Insert') return pasteKey(ev);
    if (smartCopy && ev.ctrlKey && !ev.shiftKey && !ev.altKey) {
      if (ev.code === 'KeyC' && term.hasSelection()) { post({ t: 'copy', d: term.getSelection() }); term.clearSelection(); return false; }
      if (ev.code === 'KeyV' && term.buffer.active.type !== 'alternate') return pasteKey(ev);
    }
    // 글자 크기: Ctrl+= / Ctrl+- / Ctrl+0 (이 탭만)
    if (ev.ctrlKey && !ev.shiftKey && !ev.altKey && (ev.code === 'Equal' || ev.code === 'NumpadAdd')) { setZoom(zoom + 1); return false; }
    if (ev.ctrlKey && !ev.shiftKey && !ev.altKey && (ev.code === 'Minus' || ev.code === 'NumpadSubtract')) { setZoom(zoom - 1); return false; }
    if (ev.ctrlKey && !ev.shiftKey && !ev.altKey && (ev.code === 'Digit0' || ev.code === 'Numpad0')) { setZoom(0); return false; }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyF') { openFind(); return false; }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyW') { post({ t: 'hotkey', k: 'closetab' }); return false; }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyK') { post({ t: 'hotkey', k: 'search' }); return false; }
    if (ev.ctrlKey && !ev.shiftKey && !ev.altKey && /^Digit[1-9]$/.test(ev.code)) { post({ t: 'hotkey', k: 'tab' + ev.code.slice(5) }); return false; }
    // 앱 단축키: 터미널에 포커스가 있어도 앱이 처리
    if (ev.ctrlKey && ev.code === 'Tab') { post({ t: 'hotkey', k: ev.shiftKey ? 'prevtab' : 'nexttab' }); return false; }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyA') { post({ t: 'hotkey', k: 'claude' }); return false; }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyT') { post({ t: 'hotkey', k: 'localterm' }); return false; }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyR') { post({ t: 'hotkey', k: 'reopentab' }); return false; }   // 닫은 탭 다시 열기
    return true;
  });

  // MCP 용: 현재 화면 버퍼(일반/전체화면)의 마지막 n 줄.
  // 화면 폭을 넘어 자동으로 접힌 줄(isWrapped)은 원래 한 줄로 이어 붙인다 — 긴 명령·경로·프롬프트가 잘려 읽히지 않게
  function readBuffer(n) {
    const b = term.buffer.active;
    const end = b.baseY + b.cursorY;
    const out = readLines(b, Math.max(0, end - n + 1), end);
    while (out.length && out[out.length - 1] === '') out.pop();
    return out.join('\n');
  }
  // start ~ end 줄을 읽되 화면 폭을 넘어 접힌 줄(isWrapped)은 앞줄에 이어 붙인다 (readBuffer · 프롬프트 감시 공용)
  function readLines(b, start, end) {
    const out = [];
    for (let y = start; y <= end; y++) {
      const line = b.getLine(y);
      if (!line) continue;
      const next = y < end ? b.getLine(y + 1) : null;
      // 다음 줄로 이어지는 줄은 끝 공백도 내용이라 자르지 않는다
      const s = line.translateToString(!(next && next.isWrapped));
      if (line.isWrapped && y > start && out.length) out[out.length - 1] += s;
      else out.push(s);
    }
    return out;
  }
  // (설정) 선택하면 바로 복사 · 우클릭은 항상 붙여넣기 — PuTTY · mRemoteNG 방식.
  // 드래그·더블클릭(단어)·트리플클릭(줄) 선택이 끝나 마우스 왼쪽 버튼을 뗄 때 복사하고, 선택 표시는 남겨 둔다.
  // 드래그하다 터미널 영역 밖에서 버튼을 떼도 복사되게 문서 전체에서 받는다 (찾기 상자·다시 연결 버튼은 제외)
  document.addEventListener('mouseup', e => {
    if (!copyOnSelect || e.button !== 0) return;
    if (e.target && e.target.closest && e.target.closest('#find, #reconnect')) return;
    setTimeout(() => { const s = term.getSelection(); if (s) post({ t: 'copy', d: s }); }, 0);
  });
  document.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (e.target.closest && e.target.closest('#find, #reconnect')) return;
    if (copyOnSelect) { term.clearSelection(); requestPaste(); return; }
    const s = term.getSelection();
    if (s) { post({ t: 'copy', d: s }); term.clearSelection(); }
    else requestPaste();
  });

  // ===================== 화면 내용 찾기 =====================
  const findBox = document.getElementById('find');
  const findText = document.getElementById('findText');
  const findCount = document.getElementById('findCount');
  let findPos = null;   // 마지막으로 찾은 위치 { y, x }

  function openFind() {
    findBox.style.display = 'flex';
    const sel = term.getSelection();
    if (sel && !sel.includes('\n')) findText.value = sel;
    findText.focus(); findText.select();
  }
  function closeFind() { findBox.style.display = 'none'; findPos = null; findCount.textContent = ''; findText.style.borderColor = ''; term.clearSelection(); term.focus(); }

  /**
   * 한 줄의 글자와 각 글자의 화면 칸 위치·폭. 한글·한자 같은 넓은 글자는 2칸이라
   * 문자열 위치(translateToString)를 그대로 칸 위치로 쓰면 강조가 어긋난다
   */
  function lineCells(line) {
    let s = ''; const col = [], wid = [];
    for (let x = 0; x < line.length; x++) {
      const cell = line.getCell(x, scratchCell()); if (!cell) break;
      const w = cell.getWidth(); if (w === 0) continue;   // 넓은 글자의 뒤쪽 칸
      const ch = cell.getChars() || ' ';
      for (let k = 0; k < ch.length; k++) { s += ch[k]; col.push(x); wid.push(w); }
    }
    return { s: s.replace(/\s+$/, ''), col, wid };
  }

  /** 대소문자 무시, 줄 단위로 찾기. dir: 1 = 아래(다음), -1 = 위(이전) */
  function find(dir) {
    const q = findText.value.toLowerCase();
    if (!q) { findCount.textContent = ''; findText.style.borderColor = ''; return; }
    const b = term.buffer.active;
    const total = b.length;
    const hits = [];
    for (let y = 0; y < total; y++) {
      const line = b.getLine(y); if (!line) continue;
      // 글자마다 셀을 읽는 칸 매핑은 찾는 말이 들어 있는 줄에서만 — 입력할 때마다 스크롤백(1만 줄) 전체의 셀을 훑지 않게 (CPU)
      if (line.translateToString(true).toLowerCase().indexOf(q) < 0) continue;
      const c = lineCells(line);
      const s = c.s.toLowerCase();
      let i = s.indexOf(q);
      while (i >= 0) {
        const last = i + q.length - 1;
        hits.push({ y, x: c.col[i], len: c.col[last] + c.wid[last] - c.col[i] });
        i = s.indexOf(q, i + 1);
      }
    }
    // 찾은 게 없으면 입력란 테두리·개수를 빨갛게 (있으면 원래대로)
    findText.style.borderColor = hits.length ? '' : 'var(--danger)';
    findCount.style.color = hits.length ? '' : 'var(--danger)';
    if (hits.length === 0) { findCount.textContent = '0'; term.clearSelection(); return; }
    let idx;
    if (!findPos) {
      // 처음에는 화면 아래(최근 출력)부터 위로
      idx = dir > 0 ? hits.length - 1 : hits.length - 1;
    } else {
      const cur = hits.findIndex(h => h.y === findPos.y && h.x === findPos.x);
      idx = cur < 0 ? hits.length - 1 : (cur + (dir > 0 ? 1 : -1) + hits.length) % hits.length;
    }
    const h = hits[idx];
    findPos = h;
    term.select(h.x, h.y, h.len);
    term.scrollToLine(Math.max(0, h.y - Math.floor(term.rows / 2)));
    findCount.textContent = (idx + 1) + '/' + hits.length;
  }
  findText.addEventListener('keydown', e => {
    if (e.key === 'Enter') { find(e.shiftKey ? -1 : 1); e.preventDefault(); }
    else if (e.key === 'Escape') { closeFind(); e.preventDefault(); }
    else if (e.key === 'F' && e.ctrlKey && e.shiftKey) { e.preventDefault(); }
  });
  findText.addEventListener('input', () => { findPos = null; find(-1); });
  document.getElementById('findNext').onclick = () => find(1);
  document.getElementById('findPrev').onclick = () => find(-1);
  document.getElementById('findClose').onclick = closeFind;

  // ===================== 구문 강조 =====================
  // 출력 데이터는 건드리지 않고, 화면에 그려진 줄을 읽어 xterm 데코레이션으로 글자색만 덧입힌다.
  //  - 서버가 이미 색을 지정한 글자는 건너뜀 (ls --color 등)
  //  - 전체 화면 프로그램(alternate buffer: vim, htop, less)에서는 동작 안 함
  const IP_RE = /(?<![\w.])(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:\/\d{1,2})?(?::\d{1,5})?(?![\w.])/g;
  const NUM_RE = /(?<![\w.:\/#-])\d+(?:[.,]\d+)*(?:[KMGTP]i?B?|[kmgtp]b|%|ms|us|ns|s|m|h|d)?(?![\w.:\/])/g;
  const BAD_RE = /\b(?:error|errors|err|fail|failed|failure|fatal|denied|refused|critical|exception|panic|unreachable|invalid|not found|down)\b/gi;
  const WARN_RE = /\b(?:warn|warning|warnings|deprecated|timeout|timed out|retry|retrying|pending)\b/gi;
  const GOOD_RE = /\b(?:ok|success|successful|succeeded|done|active|running|enabled|passed|healthy|up|ready|connected|accepted)\b/gi;

  let hl = { ip: true, num: true, kw: true };
  let colors = {};
  let rules = [];
  let all = [];        // 모든 데코레이션(정리용)
  let recent = [];     // 화면 근처 줄의 데코레이션 { marker(줄), items } — 커서가 위로 올라가 다시 그려질 수 있어 매번 재계산
  let mark = null;     // 다음 스캔 시작 위치 (스크롤백이 잘려도 따라가는 마커)
  let scanQueued = false;

  function buildRules() {
    rules = [];
    if (hl.ip) rules.push({ re: IP_RE, color: colors.ip });
    if (hl.kw) {
      rules.push({ re: BAD_RE, color: colors.bad });
      rules.push({ re: WARN_RE, color: colors.warn });
      rules.push({ re: GOOD_RE, color: colors.good });
      rules.push({ re: /오류|에러|실패|거부|장애|중단됨/g, color: colors.bad });
      rules.push({ re: /경고|주의|지연|재시도/g, color: colors.warn });
      rules.push({ re: /성공|완료|정상/g, color: colors.good });
    }
    if (hl.num) rules.push({ re: NUM_RE, color: colors.num });
  }

  function clearDecorations() {
    all.forEach(d => { try { d.dispose(); } catch (e) { } });
    all = []; recent = [];
    if (mark) { mark.dispose(); mark = null; }
  }

  function decorateLine(b, y, cur) {
    const line = b.getLine(y);
    if (!line) return [];
    // 줄 글자는 translateToString 한 번으로 (빈 칸은 ' ', 넓은 글자의 뒤쪽 칸은 빠짐 — 아래 셀 매핑과 같은 순서).
    // 셀마다 객체를 만드는 열 매핑은 실제로 맞는 글자가 있을 때만 만든다 (대부분의 줄은 강조할 게 없다 — 출력이 쏟아질 때 CPU 절약)
    const text = line.translateToString(true);
    if (!text) return [];
    let cols = null, widths = null;
    const mapCols = () => {
      cols = []; widths = [];
      const c = scratchCell();
      for (let x = 0; x < line.length; x++) {
        if (!line.getCell(x, c)) break;
        const w = c.getWidth();
        if (w === 0) continue;
        const ch = c.getChars() || ' ';
        for (let i = 0; i < ch.length; i++) { cols.push(x); widths.push(w); }
      }
    };

    let taken = null;
    const out = [];
    for (const rule of rules) {
      rule.re.lastIndex = 0;
      let m;
      while ((m = rule.re.exec(text))) {
        const s = m.index, e = s + m[0].length;
        if (m[0].length === 0) { rule.re.lastIndex++; continue; }
        if (!cols) { mapCols(); taken = new Uint8Array(text.length); }
        if (e > cols.length) continue;   // 매핑이 어긋난 드문 경우(조합 문자 등) — 강조하지 않는다
        let overlap = false;
        for (let i = s; i < e; i++) if (taken[i]) { overlap = true; break; }
        if (overlap) continue;
        const cell = line.getCell(cols[s], scratchCell());
        if (cell && !cell.isFgDefault()) continue;   // 서버가 색을 준 글자는 그대로
        for (let i = s; i < e; i++) taken[i] = 1;

        const marker = term.registerMarker(y - cur);
        if (!marker) continue;
        const x = cols[s];
        const width = cols[e - 1] + widths[e - 1] - x;
        const deco = term.registerDecoration({ marker, x, width, foregroundColor: rule.color, layer: 'top' });
        out.push(marker);
        if (deco) out.push(deco);
      }
    }
    return out;
  }

  function scan(backlog) {
    scanQueued = false;
    const b = term.buffer.active;
    if (b.type !== 'normal' || rules.length === 0) return;
    const cur = b.baseY + b.cursorY;
    // 다시 계산할 범위: 커서 위로 화면 한 장(진행률 표시·여러 줄 프롬프트처럼 앞줄을 고쳐 그리는 경우 대비)
    // + 지난번 스캔 이후 새로 생긴 줄 전부 (한 번에 많은 출력이 지나간 경우)
    const winStart = Math.max(0, cur - term.rows + 1);
    const last = (mark && !mark.isDisposed && mark.line >= 0) ? mark.line : Math.max(0, cur - (backlog || term.rows));
    // 한 프레임에 지나간 줄이 많아도(cat 큰 파일 등) 화면 근처(4장)만 강조한다 — 이미 스크롤로 지나간 수천 줄을
    // 프레임마다 정규식으로 훑지 않게 (CPU). 설정 변경·크기 변경(rescanAll)만 backlog 만큼 다시 그린다
    const start = Math.max(Math.min(last, winStart), cur - Math.max(backlog || 0, term.rows * 4));

    // 범위 안 줄의 이전 강조는 지우고 다시 그림
    recent = recent.filter(r => {
      if (r.marker.isDisposed) return false;
      if (r.marker.line >= start) { r.items.forEach(d => { try { d.dispose(); } catch (e) { } }); return false; }
      return r.marker.line >= cur - term.rows * 3;   // 충분히 위로 올라간 줄은 더 추적하지 않음 (강조는 유지)
    });
    for (let y = start; y <= cur; y++) {
      const items = decorateLine(b, y, cur);
      if (items.length === 0) continue;
      const lineMarker = term.registerMarker(y - cur);
      if (!lineMarker) continue;
      items.push(lineMarker);
      recent.push({ marker: lineMarker, items });
      all.push(...items);
    }
    if (mark) mark.dispose();
    mark = term.registerMarker(0);
    // 스크롤백 밖으로 밀려난 줄의 데코레이션은 xterm 이 dispose 한다 — 목록에서도 뺀다.
    // 정리 뒤에도 살아 있는 것이 많으면 한도를 늘려 프레임마다 전체를 다시 훑지 않게 (상각)
    if (all.length > allLimit) {
      all = all.filter(d => !d.isDisposed);
      allLimit = Math.max(60000, all.length * 2);
    }
  }
  let allLimit = 60000;

  function queueScan() {
    if (scanQueued || rules.length === 0) return;   // 강조를 모두 끈 경우 프레임 예약도 하지 않는다
    scanQueued = true;
    requestAnimationFrame(() => scan());
  }

  function rescanAll() {
    clearDecorations();
    buildRules();
    scan(2000);
  }

  // 크롬 문구(앱 언어). 앱이 보내지 않으면(예전 앱) 마크업의 한국어 기본값을 그대로 둔다
  function applyUiTexts(u) {
    if (!u) return;
    const set = (id, prop, v) => { if (typeof v === 'string' && v) document.getElementById(id)[prop] = v; };
    set('findText', 'placeholder', u.findPlaceholder);
    if (u.findPlaceholder) findText.setAttribute('aria-label', u.findPlaceholder);
    set('findPrev', 'title', u.findPrev);
    set('findNext', 'title', u.findNext);
    set('findClose', 'title', u.findClose);
    set('reconnectMsg', 'textContent', u.offline);
    set('reconnectBtn', 'title', u.reconnectHint);
  }

  // 테마/글꼴 적용. minimumContrastRatio 로 배경과 대비가 낮은 글자색(밝은 테마의 흰 글자 등)을 자동 보정
  function applySettings(s) {
    term.options.theme = s.theme;
    baseFontSize = s.fontSize;
    if (typeof s.zoom === 'number') zoom = Math.max(-6, Math.min(24, s.zoom));
    term.options.fontSize = Math.max(6, s.fontSize + zoom);
    smartCopy = !!s.smartCopy;
    copyOnSelect = !!s.copyOnSelect;
    term.options.fontFamily = '"' + s.fontFamily + '", "Cascadia Mono", "D2Coding", Consolas, "Malgun Gothic", monospace';
    term.options.minimumContrastRatio = s.autoContrast ? 4.5 : 1;
    document.body.style.background = s.theme.background;
    document.body.classList.toggle('light', !!s.light);
    applyUiTexts(s.ui);
    try { fit.fit(); } catch (e) { }

    hl = { ip: s.hlIp, num: s.hlNum, kw: s.hlKeywords };
    const t = s.theme;
    colors = { ip: t.cyan, num: t.magenta, bad: t.red, warn: t.yellow, good: t.green };
    rescanAll();
  }

  // 창 크기가 바뀌면 줄이 다시 배치(reflow)되므로 강조 위치를 다시 계산
  let resizeTimer = 0;
  term.onResize(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(rescanAll, 300); });
  // 전체 화면 프로그램 종료 등으로 일반 화면으로 돌아오면 이어서 스캔
  term.buffer.onBufferChange(() => queueScan());

  // 프롬프트 감시 (OSC 7 없는 셸의 SFTP 따라가기): Enter 친 줄부터 커서 줄까지를 출력이 그려질 때마다 알려준다.
  // 그려진 뒤(write 콜백)에 읽으므로 새 프롬프트를 놓치지 않고, Enter 이전 화면(지난 프롬프트)은 보내지 않는다.
  let watchMark = null, watchUntil = 0, watchQueued = false;
  function sendWatch() {
    watchQueued = false;
    if (!watchMark) return;
    if (watchMark.isDisposed || performance.now() > watchUntil) { stopWatch(); return; }
    const b = term.buffer.active;
    const cur = b.baseY + b.cursorY;
    if (cur <= watchMark.line) return;   // 아직 Enter 줄에 머무름
    // 접힌 긴 프롬프트도 한 줄로 (마지막 줄 = 커서 줄. 비어 있으면 아직 새 프롬프트가 아니다 — 앱이 판단)
    const out = readLines(b, Math.max(watchMark.line, cur - 50), cur);
    post({ t: 'screen', d: out.join('\n') });
  }
  function stopWatch() { if (watchMark) watchMark.dispose(); watchMark = null; }

  // ===================== 끊김 막대 (다시 연결) =====================
  // 연결이 끊기면 터미널 아래쪽에 버튼을 보인다 — Enter 키·탭 우클릭 말고도 눌러서 다시 연결할 수 있게
  const reconnectBar = document.getElementById('reconnect');
  const reconnectBtn = document.getElementById('reconnectBtn');
  const reconnectLabel = document.getElementById('reconnectLabel');
  function showReconnect(label) {
    reconnectLabel.textContent = label;
    reconnectBar.style.display = label ? 'flex' : 'none';
  }
  function hideReconnect() { reconnectBar.style.display = 'none'; }
  reconnectBtn.addEventListener('click', () => { hideReconnect(); post({ t: 'reconnect' }); term.focus(); });
  function afterWrite() {
    queueScan();
    // 프롬프트 감시 화면은 최대 초당 10번만 보낸다 — 출력이 쏟아지는 동안 프레임마다 50줄을 읽어 앱으로 보내지 않게 (CPU)
    if (watchMark && !watchQueued) { watchQueued = true; setTimeout(sendWatch, 100); }
  }

  window.chrome.webview.addEventListener('message', e => {
    const m = e.data;
    switch (m.t) {
      // 다 그린 뒤 글자 수를 앱에 돌려준다 — 앱은 안 그려진 분량이 많으면 보내기를 멈춘다 (흐름 제어)
      case 'out': { const n = m.d.length; term.write(m.d, () => { post({ t: 'ack', n }); afterWrite(); }); break; }
      case 'offline': showReconnect(String(m.label || '')); break;
      case 'online': hideReconnect(); break;
      case 'watch':
        // 이미 지켜보는 중이면(앞 명령의 프롬프트가 오기 전에 다음 명령을 친 경우) 시작 줄은 그대로 두고 시간만 늘린다
        if (!watchMark || watchMark.isDisposed || performance.now() > watchUntil) { stopWatch(); watchMark = term.registerMarker(0); }
        watchUntil = performance.now() + (m.ms || 10000);
        break;
      case 'unwatch': stopWatch(); break;
      // 앱이 이미 걸렀지만 한 번 더: 탭·CR·LF 외 C0, DEL, C1 제어 문자 제거 (bracketed paste 탈출 방지)
      case 'paste': term.paste(String(m.d).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f-\x9f]/g, '')); break;
      case 'focus': term.focus(); break;
      case 'setzoom': setZoom(Number(m.z) || 0); break;
      case 'settings': applySettings(m); break;
    }
  });

  term.focus();
  post({ t: 'ready', cols: term.cols, rows: term.rows });
</script>
</body>
</html>
