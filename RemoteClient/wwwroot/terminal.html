<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #161925; overflow: hidden; }
  #t { position: absolute; top: 10px; left: 14px; right: 6px; bottom: 6px; }
  .xterm .xterm-viewport { scrollbar-width: thin; scrollbar-color: #2E3350 transparent; }
  /* 화면 내용 찾기 (Ctrl+Shift+F) */
  #find { position: absolute; top: 8px; right: 18px; z-index: 10; display: none; align-items: center; gap: 6px;
          background: #1B1E2C; border: 1px solid #2E3350; border-radius: 8px; padding: 5px 6px 5px 10px;
          font: 12px "Segoe UI", "Malgun Gothic", sans-serif; color: #9AA0B8; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #find input { width: 220px; background: #12141E; color: #E6E8F0; border: 1px solid #2E3350; border-radius: 6px;
                padding: 4px 8px; font: 13px "Segoe UI", "Malgun Gothic", sans-serif; outline: none; }
  #find input:focus { border-color: #20C5A0; }
  #find button { background: transparent; color: #C9CDDB; border: 0; border-radius: 5px; cursor: pointer; padding: 3px 7px; font-size: 13px; }
  #find button:hover { background: #262B40; }
</style>
</head>
<body>
<div id="t"></div>
<div id="find"><input id="findText" spellcheck="false"><span id="findCount"></span>
  <button id="findPrev" title="Shift+Enter">&#x25B2;</button><button id="findNext" title="Enter">&#x25BC;</button><button id="findClose" title="Esc">&#x2715;</button></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  const term = new Terminal({
    fontFamily: '"Cascadia Mono", "D2Coding", Consolas, "Malgun Gothic", monospace',
    fontSize: 14,
    lineHeight: 1.15,
    cursorBlink: true,
    scrollback: 10000,
    allowProposedApi: true,
    theme: {
      background: '#161925', foreground: '#E6E8F0', cursor: '#20C5A0', cursorAccent: '#161925',
      selectionBackground: '#3A4A6A',
      black: '#1E2232', red: '#F0616D', green: '#20C5A0', yellow: '#F5B740',
      blue: '#4F8CFF', magenta: '#C27BFF', cyan: '#3EC7E0', white: '#C9CDDB',
      brightBlack: '#5B6180', brightRed: '#FF7A85', brightGreen: '#4BE0BC', brightYellow: '#FFD06B',
      brightBlue: '#7AA8FF', brightMagenta: '#D59BFF', brightCyan: '#6ADCF0', brightWhite: '#FFFFFF'
    }
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  const el = document.getElementById('t');
  term.open(el);
  fit.fit();

  const post = m => window.chrome.webview.postMessage(m);

  term.onData(d => post({ t: 'in', d }));
  // 셸이 알려주는 현재 폴더 (OSC 7: ESC ] 7 ; file://host/path BEL) → SFTP 패널이 따라감
  term.parser.registerOscHandler(7, data => { post({ t: 'cwd', d: data }); return true; });
  term.onResize(({ cols, rows }) => post({ t: 'resize', cols, rows }));
  new ResizeObserver(() => { try { fit.fit(); } catch (e) { } }).observe(el);

  // 붙여넣기 요청: 서버가 bracketed paste 를 켰으면(줄마다 바로 실행되지 않음) 앱이 확인 창을 띄우지 않는다
  const requestPaste = () => post({ t: 'paste', bp: !!(term.modes && term.modes.bracketedPasteMode) });
  let smartCopy = true;
  let baseFontSize = 14, zoom = 0;
  function setZoom(z) {
    zoom = Math.max(-6, Math.min(24, z));
    term.options.fontSize = Math.max(6, baseFontSize + zoom);
    try { fit.fit(); } catch (e) { }
  }
  el.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    setZoom(zoom + (e.deltaY < 0 ? 1 : -1));
  }, { passive: false });

  // 복사/붙여넣기: Ctrl+Shift+C / Ctrl+Shift+V, 우클릭(선택 있으면 복사, 없으면 붙여넣기)
  // (설정) Ctrl+C 는 선택이 있을 때만 복사, Ctrl+V 는 붙여넣기 — 단 vim·htop 같은 전체 화면 프로그램(대체 화면 버퍼)
  // 안에서는 Ctrl+V 를 프로그램에 그대로 보낸다 (vim 의 블록 선택 등)
  term.attachCustomKeyEventHandler(ev => {
    if (ev.type !== 'keydown') return true;
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyC') {
      const s = term.getSelection(); if (s) post({ t: 'copy', d: s });
      return false;
    }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyV') { requestPaste(); return false; }
    if (ev.shiftKey && ev.code === 'Insert') { requestPaste(); return false; }
    if (smartCopy && ev.ctrlKey && !ev.shiftKey && !ev.altKey) {
      if (ev.code === 'KeyC' && term.hasSelection()) { post({ t: 'copy', d: term.getSelection() }); term.clearSelection(); return false; }
      if (ev.code === 'KeyV' && term.buffer.active.type !== 'alternate') { requestPaste(); return false; }
    }
    // 글자 크기: Ctrl+= / Ctrl+- / Ctrl+0 (이 탭만)
    if (ev.ctrlKey && !ev.shiftKey && !ev.altKey && (ev.code === 'Equal' || ev.code === 'NumpadAdd')) { setZoom(zoom + 1); return false; }
    if (ev.ctrlKey && !ev.shiftKey && !ev.altKey && (ev.code === 'Minus' || ev.code === 'NumpadSubtract')) { setZoom(zoom - 1); return false; }
    if (ev.ctrlKey && !ev.shiftKey && !ev.altKey && (ev.code === 'Digit0' || ev.code === 'Numpad0')) { setZoom(0); return false; }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyF') { openFind(); return false; }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyW') { post({ t: 'hotkey', k: 'closetab' }); return false; }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyK') { post({ t: 'hotkey', k: 'search' }); return false; }
    if (ev.ctrlKey && !ev.shiftKey && !ev.altKey && /^Digit[1-9]$/.test(ev.code)) { post({ t: 'hotkey', k: 'tab' + ev.code.slice(5) }); return false; }
    // 앱 단축키: 터미널에 포커스가 있어도 앱이 처리
    if (ev.ctrlKey && ev.code === 'Tab') { post({ t: 'hotkey', k: ev.shiftKey ? 'prevtab' : 'nexttab' }); return false; }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyA') { post({ t: 'hotkey', k: 'claude' }); return false; }
    if (ev.ctrlKey && ev.shiftKey && ev.code === 'KeyT') { post({ t: 'hotkey', k: 'localterm' }); return false; }
    return true;
  });

  // MCP 용: 현재 화면 버퍼(일반/전체화면)의 마지막 n 줄
  function readBuffer(n) {
    const b = term.buffer.active;
    const end = b.baseY + b.cursorY;
    const out = [];
    for (let y = Math.max(0, end - n + 1); y <= end; y++) {
      const line = b.getLine(y);
      if (line) out.push(line.translateToString(true));
    }
    while (out.length && out[out.length - 1] === '') out.pop();
    return out.join('\n');
  }
  document.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (e.target.closest && e.target.closest('#find')) return;
    const s = term.getSelection();
    if (s) { post({ t: 'copy', d: s }); term.clearSelection(); }
    else requestPaste();
  });

  // ===================== 화면 내용 찾기 =====================
  const findBox = document.getElementById('find');
  const findText = document.getElementById('findText');
  const findCount = document.getElementById('findCount');
  let findPos = null;   // 마지막으로 찾은 위치 { y, x }

  function openFind() {
    findBox.style.display = 'flex';
    const sel = term.getSelection();
    if (sel && !sel.includes('\n')) findText.value = sel;
    findText.focus(); findText.select();
  }
  function closeFind() { findBox.style.display = 'none'; findPos = null; findCount.textContent = ''; term.clearSelection(); term.focus(); }

  /**
   * 한 줄의 글자와 각 글자의 화면 칸 위치·폭. 한글·한자 같은 넓은 글자는 2칸이라
   * 문자열 위치(translateToString)를 그대로 칸 위치로 쓰면 강조가 어긋난다
   */
  function lineCells(line) {
    let s = ''; const col = [], wid = [];
    for (let x = 0; x < line.length; x++) {
      const cell = line.getCell(x); if (!cell) break;
      const w = cell.getWidth(); if (w === 0) continue;   // 넓은 글자의 뒤쪽 칸
      const ch = cell.getChars() || ' ';
      for (let k = 0; k < ch.length; k++) { s += ch[k]; col.push(x); wid.push(w); }
    }
    return { s: s.replace(/\s+$/, ''), col, wid };
  }

  /** 대소문자 무시, 줄 단위로 찾기. dir: 1 = 아래(다음), -1 = 위(이전) */
  function find(dir) {
    const q = findText.value.toLowerCase();
    if (!q) { findCount.textContent = ''; return; }
    const b = term.buffer.active;
    const total = b.length;
    const hits = [];
    for (let y = 0; y < total; y++) {
      const line = b.getLine(y); if (!line) continue;
      const c = lineCells(line);
      const s = c.s.toLowerCase();
      let i = s.indexOf(q);
      while (i >= 0) {
        const last = i + q.length - 1;
        hits.push({ y, x: c.col[i], len: c.col[last] + c.wid[last] - c.col[i] });
        i = s.indexOf(q, i + 1);
      }
    }
    if (hits.length === 0) { findCount.textContent = '0'; term.clearSelection(); return; }
    let idx;
    if (!findPos) {
      // 처음에는 화면 아래(최근 출력)부터 위로
      idx = dir > 0 ? hits.length - 1 : hits.length - 1;
    } else {
      const cur = hits.findIndex(h => h.y === findPos.y && h.x === findPos.x);
      idx = cur < 0 ? hits.length - 1 : (cur + (dir > 0 ? 1 : -1) + hits.length) % hits.length;
    }
    const h = hits[idx];
    findPos = h;
    term.select(h.x, h.y, h.len);
    term.scrollToLine(Math.max(0, h.y - Math.floor(term.rows / 2)));
    findCount.textContent = (idx + 1) + '/' + hits.length;
  }
  findText.addEventListener('keydown', e => {
    if (e.key === 'Enter') { find(e.shiftKey ? -1 : 1); e.preventDefault(); }
    else if (e.key === 'Escape') { closeFind(); e.preventDefault(); }
    else if (e.key === 'F' && e.ctrlKey && e.shiftKey) { e.preventDefault(); }
  });
  findText.addEventListener('input', () => { findPos = null; find(-1); });
  document.getElementById('findNext').onclick = () => find(1);
  document.getElementById('findPrev').onclick = () => find(-1);
  document.getElementById('findClose').onclick = closeFind;

  // ===================== 구문 강조 =====================
  // 출력 데이터는 건드리지 않고, 화면에 그려진 줄을 읽어 xterm 데코레이션으로 글자색만 덧입힌다.
  //  - 서버가 이미 색을 지정한 글자는 건너뜀 (ls --color 등)
  //  - 전체 화면 프로그램(alternate buffer: vim, htop, less)에서는 동작 안 함
  const IP_RE = /(?<![\w.])(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:\/\d{1,2})?(?::\d{1,5})?(?![\w.])/g;
  const NUM_RE = /(?<![\w.:\/#-])\d+(?:[.,]\d+)*(?:[KMGTP]i?B?|[kmgtp]b|%|ms|us|ns|s|m|h|d)?(?![\w.:\/])/g;
  const BAD_RE = /\b(?:error|errors|err|fail|failed|failure|fatal|denied|refused|critical|exception|panic|unreachable|invalid|not found|down)\b/gi;
  const WARN_RE = /\b(?:warn|warning|warnings|deprecated|timeout|timed out|retry|retrying|pending)\b/gi;
  const GOOD_RE = /\b(?:ok|success|successful|succeeded|done|active|running|enabled|passed|healthy|up|ready|connected|accepted)\b/gi;

  let hl = { ip: true, num: true, kw: true };
  let colors = {};
  let rules = [];
  let all = [];        // 모든 데코레이션(정리용)
  let recent = [];     // 화면 근처 줄의 데코레이션 { marker(줄), items } — 커서가 위로 올라가 다시 그려질 수 있어 매번 재계산
  let mark = null;     // 다음 스캔 시작 위치 (스크롤백이 잘려도 따라가는 마커)
  let scanQueued = false;

  function buildRules() {
    rules = [];
    if (hl.ip) rules.push({ re: IP_RE, color: colors.ip });
    if (hl.kw) {
      rules.push({ re: BAD_RE, color: colors.bad });
      rules.push({ re: WARN_RE, color: colors.warn });
      rules.push({ re: GOOD_RE, color: colors.good });
      rules.push({ re: /오류|에러|실패|거부|장애|중단됨/g, color: colors.bad });
      rules.push({ re: /경고|주의|지연|재시도/g, color: colors.warn });
      rules.push({ re: /성공|완료|정상/g, color: colors.good });
    }
    if (hl.num) rules.push({ re: NUM_RE, color: colors.num });
  }

  function clearDecorations() {
    all.forEach(d => { try { d.dispose(); } catch (e) { } });
    all = []; recent = [];
    if (mark) { mark.dispose(); mark = null; }
  }

  function decorateLine(b, y, cur) {
    const line = b.getLine(y);
    if (!line) return [];
    // 문자열 인덱스 → 셀 열 매핑 (한글 등 넓은 문자는 2칸)
    let text = '', cols = [], widths = [];
    for (let x = 0; x < term.cols; x++) {
      const cell = line.getCell(x);
      if (!cell) break;
      const w = cell.getWidth();
      if (w === 0) continue;
      const ch = cell.getChars() || ' ';
      for (let i = 0; i < ch.length; i++) { cols.push(x); widths.push(w); }
      text += ch;
    }
    text = text.replace(/\s+$/, '');
    if (!text) return [];

    const taken = new Uint8Array(text.length);
    const out = [];
    for (const rule of rules) {
      rule.re.lastIndex = 0;
      let m;
      while ((m = rule.re.exec(text))) {
        const s = m.index, e = s + m[0].length;
        if (m[0].length === 0) { rule.re.lastIndex++; continue; }
        let overlap = false;
        for (let i = s; i < e; i++) if (taken[i]) { overlap = true; break; }
        if (overlap) continue;
        const cell = line.getCell(cols[s]);
        if (cell && !cell.isFgDefault()) continue;   // 서버가 색을 준 글자는 그대로
        for (let i = s; i < e; i++) taken[i] = 1;

        const marker = term.registerMarker(y - cur);
        if (!marker) continue;
        const x = cols[s];
        const width = cols[e - 1] + widths[e - 1] - x;
        const deco = term.registerDecoration({ marker, x, width, foregroundColor: rule.color, layer: 'top' });
        out.push(marker);
        if (deco) out.push(deco);
      }
    }
    return out;
  }

  function scan(backlog) {
    scanQueued = false;
    const b = term.buffer.active;
    if (b.type !== 'normal' || rules.length === 0) return;
    const cur = b.baseY + b.cursorY;
    // 다시 계산할 범위: 커서 위로 화면 한 장(진행률 표시·여러 줄 프롬프트처럼 앞줄을 고쳐 그리는 경우 대비)
    // + 지난번 스캔 이후 새로 생긴 줄 전부 (한 번에 많은 출력이 지나간 경우)
    const winStart = Math.max(0, cur - term.rows + 1);
    const last = (mark && !mark.isDisposed && mark.line >= 0) ? mark.line : Math.max(0, cur - (backlog || term.rows));
    const start = Math.min(last, winStart);

    // 범위 안 줄의 이전 강조는 지우고 다시 그림
    recent = recent.filter(r => {
      if (r.marker.isDisposed) return false;
      if (r.marker.line >= start) { r.items.forEach(d => { try { d.dispose(); } catch (e) { } }); return false; }
      return r.marker.line >= cur - term.rows * 3;   // 충분히 위로 올라간 줄은 더 추적하지 않음 (강조는 유지)
    });
    for (let y = start; y <= cur; y++) {
      const items = decorateLine(b, y, cur);
      if (items.length === 0) continue;
      const lineMarker = term.registerMarker(y - cur);
      if (!lineMarker) continue;
      items.push(lineMarker);
      recent.push({ marker: lineMarker, items });
      all.push(...items);
    }
    if (mark) mark.dispose();
    mark = term.registerMarker(0);
    if (all.length > 60000) all = all.filter(d => !d.isDisposed);
  }

  function queueScan() {
    if (scanQueued) return;
    scanQueued = true;
    requestAnimationFrame(() => scan());
  }

  function rescanAll() {
    clearDecorations();
    buildRules();
    scan(2000);
  }

  // 테마/글꼴 적용. minimumContrastRatio 로 배경과 대비가 낮은 글자색(밝은 테마의 흰 글자 등)을 자동 보정
  function applySettings(s) {
    term.options.theme = s.theme;
    baseFontSize = s.fontSize;
    term.options.fontSize = Math.max(6, s.fontSize + zoom);
    smartCopy = !!s.smartCopy;
    term.options.fontFamily = '"' + s.fontFamily + '", "Cascadia Mono", "D2Coding", Consolas, "Malgun Gothic", monospace';
    term.options.minimumContrastRatio = s.autoContrast ? 4.5 : 1;
    document.body.style.background = s.theme.background;
    try { fit.fit(); } catch (e) { }

    hl = { ip: s.hlIp, num: s.hlNum, kw: s.hlKeywords };
    const t = s.theme;
    colors = { ip: t.cyan, num: t.magenta, bad: t.red, warn: t.yellow, good: t.green };
    rescanAll();
  }

  // 창 크기가 바뀌면 줄이 다시 배치(reflow)되므로 강조 위치를 다시 계산
  let resizeTimer = 0;
  term.onResize(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(rescanAll, 300); });
  // 전체 화면 프로그램 종료 등으로 일반 화면으로 돌아오면 이어서 스캔
  term.buffer.onBufferChange(() => queueScan());

  // 프롬프트 감시 (OSC 7 없는 셸의 SFTP 따라가기): Enter 친 줄부터 커서 줄까지를 출력이 그려질 때마다 알려준다.
  // 그려진 뒤(write 콜백)에 읽으므로 새 프롬프트를 놓치지 않고, Enter 이전 화면(지난 프롬프트)은 보내지 않는다.
  let watchMark = null, watchUntil = 0, watchQueued = false;
  function sendWatch() {
    watchQueued = false;
    if (!watchMark) return;
    if (watchMark.isDisposed || performance.now() > watchUntil) { stopWatch(); return; }
    const b = term.buffer.active;
    const cur = b.baseY + b.cursorY;
    if (cur <= watchMark.line) return;   // 아직 Enter 줄에 머무름
    const out = [];
    for (let y = Math.max(watchMark.line, cur - 50); y <= cur; y++) {
      const line = b.getLine(y);
      if (line) out.push(line.translateToString(true));
    }
    post({ t: 'screen', d: out.join('\n') });
  }
  function stopWatch() { if (watchMark) watchMark.dispose(); watchMark = null; }
  function afterWrite() {
    queueScan();
    if (watchMark && !watchQueued) { watchQueued = true; requestAnimationFrame(sendWatch); }
  }

  window.chrome.webview.addEventListener('message', e => {
    const m = e.data;
    switch (m.t) {
      case 'out': term.write(m.d, afterWrite); break;
      case 'watch':
        // 이미 지켜보는 중이면(앞 명령의 프롬프트가 오기 전에 다음 명령을 친 경우) 시작 줄은 그대로 두고 시간만 늘린다
        if (!watchMark || watchMark.isDisposed || performance.now() > watchUntil) { stopWatch(); watchMark = term.registerMarker(0); }
        watchUntil = performance.now() + (m.ms || 10000);
        break;
      case 'unwatch': stopWatch(); break;
      case 'paste': term.paste(m.d); break;
      case 'focus': term.focus(); break;
      case 'settings': applySettings(m); break;
    }
  });

  term.focus();
  post({ t: 'ready', cols: term.cols, rows: term.rows });
</script>
</body>
</html>
